name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q midnight-fishing-apk.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: bash scripts/ci-build.sh
        working-directory: midnight-fishing-apk
      - uses: actions/upload-artifact@v4
        with:
          name: MidnightFishing-APK
          path: midnight-fishing-apk/android/app/build/outputs/apk/debug/app-debug.apk
